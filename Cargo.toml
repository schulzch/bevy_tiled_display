[package]
name = "bevy_tiled_display"
version = "0.16.0"
edition = "2024"

description = "Bevy plugin for working with large multi-machine tiled displays"
authors = ["Christoph Schulz <schulzcbs@gmail.com>"]

[lib]
crate-type = ["rlib"]

[dependencies]
bevy = "0.16"
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.38", features = ["serialize"] }
hostname = "0.4"
mpi = { git = "https://github.com/rsmpi/rsmpi.git", optional = true }
bincode = "1"
socket2 = "0.6"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
mockall = "0.14"

[features]
default = []
mpi = ["dep:mpi"]
